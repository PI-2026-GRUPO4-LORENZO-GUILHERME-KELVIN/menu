<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio of Kelvin Fellipe Da Silva De Souza</title>

<body>

<style>
  
    :root {
        --background: #f3f7f2;
        --text: #26352a;
        --card: #ffffff;
        --header: #145c36;
        --button: #238443;
        --button-hover: #17652f;
        --accent: #70ad45;
        --border: #d5e3d5;
        --shadow: rgba(0, 0, 0, 0.10);
    }

   
    :root[data-theme="dark"] {
        --background: #17231b;
        --text: #e5eee6;
        --card: #24352a;
        --header: #0d3b25;
        --button: #328c50;
        --button-hover: #46a866;
        --accent: #83bd60;
        --border: #3b5944;
        --shadow: rgba(0, 0, 0, 0.30);
    }




    * {
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--background);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.6;
        transition: background-color 0.3s, color 0.3s;
    }

    main {
        width: 100%;
        padding: 20px;
    }

    h1, h2, h3 {
        color: var(--header);
        line-height: 1.3;
    }

    :root[data-theme="dark"] h1,
    :root[data-theme="dark"] h2,
    :root[data-theme="dark"] h3 {
        color: var(--accent);
    }

    p {
        color: var(--text);
    }

    a {
        color: var(--button);
        transition: color 0.3s;
    }

    a:hover {
        color: var(--button-hover);
    }


   

    header {
        background-color: var(--header);
        color: #ffffff;
        text-align: center;
        padding: 25px 15px;
    }

    header h1 {
        color: #ffffff;
        margin: 0;
    }

    .header-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 18px;
    }

    .header-buttons button,
    .language-button {
        background-color: var(--button);
        color: #ffffff;
        border: 1px solid rgba(255,255,255,0.25);
        border-radius: 8px;
        padding: 10px 16px;
        font-size: 15px;
        font-weight: bold;
        text-decoration: none;
        cursor: pointer;
        transition: background-color 0.3s, transform 0.2s;
    }

    .header-buttons button:hover,
    .language-button:hover {
        background-color: var(--button-hover);
        color: #ffffff;
        transform: translateY(-2px);
    }

    article {
        background-color: var(--card);
        color: var(--text);
        max-width: 1000px;
        margin: 25px
